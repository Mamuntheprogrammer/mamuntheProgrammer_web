<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Blueprint dark background -->
  <rect width="64" height="64" rx="14" fill="#0a0e14"/>
  <!-- Subtle grid lines -->
  <line x1="8" y1="32" x2="56" y2="32" stroke="#5eead4" stroke-opacity="0.1" stroke-width="1"/>
  <line x1="32" y1="8" x2="32" y2="56" stroke="#5eead4" stroke-opacity="0.1" stroke-width="1"/>
  <rect x="6" y="6" width="52" height="52" rx="10" stroke="#5eead4" stroke-opacity="0.2" stroke-width="1.5" stroke-dasharray="4 3"/>
  <!-- Pipeline 'M' drawn as one continuous stroke -->
  <path d="M 16 48 L 16 18 L 32 36 L 48 18 L 48 48" stroke="#5eead4" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Amber glowing data packet at apex -->
  <circle cx="32" cy="36" r="4" fill="#fbbf24"/>
  <circle cx="32" cy="36" r="7" stroke="#fbbf24" stroke-opacity="0.4" stroke-width="1.5"/>
</svg>
